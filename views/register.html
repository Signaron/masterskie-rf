<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация - Мастерские.РФ</title>
  <link rel="icon" href="/images/favicon.png" type="image/png">
  <link rel="stylesheet" href="/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/bootstrap/bootstrap.bundle.min.js" defer></script>
  <script src="/js/Validator.js" defer></script>
  <script src="/js/common.js" defer></script>
  <script src="/js/register.js" defer></script>
</head>
<body>
<!-- header -->

  <main class="auth">
    <img class="auth-bg" src="/images/auth-bg.webp" width="390" height="844"
         alt="Деревянные полки с глиняными чашами в мастерской">

    <div class="auth-panel">
      <h1 class="rise">Регистрация</h1>
      <p class="lead rise">Все поля обязательны. После регистрации можно записаться на&nbsp;мастер-класс.</p>
      <p class="notice" id="message" hidden></p>

      <form class="rise" id="register-form" novalidate>
        <div class="field">
          <label class="field-label" for="login">Логин</label>
          <input class="form-control" id="login" name="login" maxlength="50" autocomplete="username"
                 placeholder="например, ivan2027" aria-describedby="login-error">
          <p class="field-error" id="login-error" data-for="login" aria-live="polite"></p>
        </div>
        <div class="field">
          <label class="field-label" for="password">Пароль</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="new-password"
                 placeholder="Не меньше 8 символов" aria-describedby="password-error">
          <p class="field-error" id="password-error" data-for="password" aria-live="polite"></p>
        </div>
        <div class="field">
          <label class="field-label" for="fio">ФИО</label>
          <input class="form-control" id="fio" name="fio" maxlength="150" autocomplete="name"
                 placeholder="например, Петров Иван Сергеевич" aria-describedby="fio-error">
          <p class="field-error" id="fio-error" data-for="fio" aria-live="polite"></p>
        </div>
        <div class="field">
          <label class="field-label" for="phone">Телефон</label>
          <input class="form-control" id="phone" name="phone" type="tel" inputmode="tel" maxlength="20" autocomplete="tel"
                 placeholder="8(912)345-67-89" aria-describedby="phone-error">
          <p class="field-error" id="phone-error" data-for="phone" aria-live="polite"></p>
        </div>
        <div class="field">
          <label class="field-label" for="email">Электронная почта</label>
          <input class="form-control" id="email" name="email" type="email" maxlength="100" autocomplete="email"
                 placeholder="например, ivan@mail.ru" aria-describedby="email-error">
          <p class="field-error" id="email-error" data-for="email" aria-live="polite"></p>
        </div>

        <button class="btn-main btn-wide" type="submit">Зарегистрироваться</button>
      </form>

      <p class="auth-switch rise"><a href="/login">Уже есть аккаунт? <span>Войти</span></a></p>
    </div>
  </main>

<!-- footer -->
</body>
</html>
