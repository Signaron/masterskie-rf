<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Панель администратора - Мастерские.РФ</title>
  <link rel="icon" href="/images/favicon.png" type="image/png">
  <link rel="stylesheet" href="/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/bootstrap/bootstrap.bundle.min.js" defer></script>
  <script src="/js/common.js" defer></script>
  <script src="/js/admin.js" defer></script>
</head>
<body>
<!-- header -->

  <main class="container page">
    <div class="page-head">
      <div>
        <h1 class="rise">Заявки</h1>
        <p class="lead rise">Проверьте данные и&nbsp;смените статус: «Запись подтверждена» или «Завершено».</p>
      </div>
    </div>

    <!-- Кнопки фильтра строит admin.js из таблицы statuses; выборку делает база -->
    <div class="filter rise" id="filter" role="group" aria-label="Фильтр по статусу"></div>
    <p class="count" id="count" aria-live="polite"></p>
    <p class="notice" id="message" hidden></p>

    <!-- Широкий экран: таблица -->
    <div class="table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th scope="col">№</th>
            <th scope="col">Пользователь</th>
            <th scope="col">Мастерская</th>
            <th scope="col">Дата</th>
            <th scope="col">Оплата</th>
            <th scope="col">Статус</th>
            <th scope="col">Действие</th>
          </tr>
        </thead>
        <tbody class="stagger" id="rows"></tbody>
      </table>
    </div>

    <!-- Смартфон и планшет: карточки -->
    <div class="admin-cards row g-3 row-cols-1 row-cols-md-2 stagger" id="cards"></div>

    <div class="empty" id="empty" hidden>
      <img src="/images/empty.webp" alt="Открытая коробка с кистью, свечой и глиной" width="480" height="270" loading="lazy">
      <p class="empty-text">Заявок с&nbsp;таким статусом нет.</p>
    </div>
  </main>

<!-- footer -->
</body>
</html>
